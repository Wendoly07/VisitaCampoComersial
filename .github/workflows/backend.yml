# Despliega el backend en Azure App Service (Linux, Node 20)
# Requisitos: secreto AZURE_WEBAPP_PUBLISH_PROFILE (perfil de publicación del App Service)
#             variable AZURE_WEBAPP_NAME (nombre del App Service)
name: Backend - Azure App Service

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
