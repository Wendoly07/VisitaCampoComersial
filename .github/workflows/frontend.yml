# Despliega el frontend en Azure Static Web Apps
# Requisitos: secreto AZURE_STATIC_WEB_APPS_API_TOKEN (token de implementación de la Static Web App)
#             variable VITE_API_URL (URL del backend, ej. https://visitapro-api.azurewebsites.net)
name: Frontend - Azure Static Web Apps

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_api_build: true
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
